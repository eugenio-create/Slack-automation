# ============================================================
# Notificação horária de leads — cron do GitHub Actions
# ============================================================
# Chama o endpoint /api/notificar-leads (Vercel) de hora em hora.
# O cron nativo da Vercel no plano Hobby só permite 1 execução/dia,
# por isso o agendamento fica aqui.
#
# Configuração:
#   NOTIF_URL    : fixa abaixo (env do job) — a URL do deploy não é
#                  sensível, o endpoint é protegido pelo segredo.
#                  Se a URL do deploy mudar, atualize aqui.
#   NOTIF_SECRET : secret do repositório (Settings → Secrets and
#                  variables → Actions), mesmo valor configurado na
#                  Vercel. NUNCA commitar o valor — o repo é público.
#
# Sobre atrasos: o cron do GitHub pode atrasar alguns minutos — inofensivo,
# porque o endpoint reporta a hora-relógio ANTERIOR completa (janela
# determinística). Atraso além da virada da hora seguinte pula aquela
# janela (tradeoff aceito, ver README).
# ============================================================
name: Notificação horária de leads

on:
  schedule:
    - cron: '5 * * * *'   # minuto 5: menos congestionado que :00
  workflow_dispatch:        # disparo manual para testes

jobs:
  notificar:
    runs-on: ubuntu-latest
    env:
      NOTIF_URL: https://slack-automation-vnr8-ashy.vercel.app
    steps:
      - name: Validar secret
        run: |
          if [ -z "${{ secrets.NOTIF_SECRET }}" ]; then
            echo "::error::Secret NOTIF_SECRET ausente no GitHub — crie em Settings → Secrets and variables → Actions com o mesmo valor configurado na Vercel (ver README, seção 'Notificação horária de leads')."
            exit 1
          fi

      - name: Chamar endpoint de notificação
        run: |
          curl -sS -f --retry 3 --retry-delay 10 \
            -X POST "${NOTIF_URL%/}/api/notificar-leads" \
            -H "x-notif-secret: ${{ secrets.NOTIF_SECRET }}"
